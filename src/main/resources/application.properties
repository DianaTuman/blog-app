spring.application.name=blog-app

#Multipart
spring.servlet.multipart.max-request-size=418018841
spring.servlet.multipart.max-file-size=20848820
spring.servlet.multipart.file-size-threshold=1048576

#DB
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/practicum
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}